name: Build Android App Bundle (Google Play)

on:
  push:
    branches: ['main']
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application Bundle
        run: npx vite build --base=./

      - name: Sync Capacitor to Native Android
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install Android Platform 36 & Accept Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36"

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android App Bundle (AAB) & APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          cd android
          if ! ./gradlew bundleRelease assembleDebug --stacktrace --no-daemon > gradle.log 2>&1; then
            cat gradle.log | tail -n 80
            MSG=$(grep -A 10 "What went wrong:" gradle.log | tr '\r\n' ' ' | sed 's/"/\\"/g')
            if [ -z "$MSG" ]; then
              MSG=$(tail -n 30 gradle.log | tr '\r\n' ' ' | sed 's/"/\\"/g')
            fi
            echo "::error title=Gradle Task Failure::$MSG"
            exit 1
          fi

      - name: Report Build Output
        if: always()
        run: |
          echo "### Gradle Output Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 80 android/gradle.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Gradle Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: android/gradle.log

      - name: Upload Google Play Store Bundle (.aab)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: google-play-bundle-aab
          path: android/app/build/outputs/bundle/**/*.aab

      - name: Upload Test APK (.apk)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: test-apk
          path: android/app/build/outputs/apk/**/*.apk
