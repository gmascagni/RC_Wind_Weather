<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1324" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="fuselageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <!-- App Icon Rounded Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="#1e293b" stroke-width="6" />

  <!-- Tactical Radar Rings -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="#0ea5e9" stroke-opacity="0.2" stroke-width="4" stroke-dasharray="12 10" />
  <circle cx="256" cy="256" r="136" fill="none" stroke="#10b981" stroke-opacity="0.18" stroke-width="3" />

  <!-- RC Transmitter Radio Waves (Top Left) -->
  <path d="M98 146 A 70 70 0 0 1 146 98" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" />
  <path d="M74 170 A 105 105 0 0 1 170 74" fill="none" stroke="#38bdf8" stroke-opacity="0.65" stroke-width="8" stroke-linecap="round" />
  <path d="M50 194 A 140 140 0 0 1 194 50" fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round" />

  <!-- RC Sport Airplane (angled at 45 deg into the wind) -->
  <g transform="translate(256 262) rotate(-45) translate(-256 -256)">
    <!-- Propeller Blur Disc -->
    <ellipse cx="256" cy="68" rx="58" ry="10" fill="#38bdf8" fill-opacity="0.35" stroke="#7dd3fc" stroke-width="3" />

    <!-- Main High-Aspect RC Wing -->
    <path
      d="M64 218 L226 178 L286 178 L448 218 L436 254 L284 240 L228 240 L76 254 Z"
      fill="url(#wingGrad)"
      stroke="#ecfdf5"
      stroke-width="6"
      stroke-linejoin="round"
    />
    <!-- Wing Stripes (RC livery) -->
    <path d="M104 212 L152 200 L144 246 L96 250 Z" fill="#0ea5e9" />
    <path d="M408 212 L360 200 L368 246 L416 250 Z" fill="#0ea5e9" />

    <!-- Horizontal Stabilizer (Tailplane) -->
    <path
      d="M168 386 L236 364 L276 364 L344 386 L336 410 L274 402 L238 402 L176 410 Z"
      fill="#0ea5e9"
      stroke="#e0f2fe"
      stroke-width="5"
      stroke-linejoin="round"
    />

    <!-- Fuselage -->
    <path
      d="M256 82 C276 82 288 128 286 210 L274 416 C272 432 264 440 256 440 C248 440 240 432 238 416 L226 210 C224 128 236 82 256 82 Z"
      fill="url(#fuselageGrad)"
      stroke="#0f172a"
      stroke-width="6"
    />

    <!-- Cockpit Canopy -->
    <ellipse cx="256" cy="176" rx="18" ry="38" fill="#0284c7" stroke="#e0f2fe" stroke-width="4" />
    <ellipse cx="251" cy="166" rx="6" ry="18" fill="#7dd3fc" fill-opacity="0.6" />

    <!-- Red Nose Spinner -->
    <path d="M238 92 C244 62 268 62 274 92 Z" fill="#f43f5e" stroke="#ffe4e6" stroke-width="4" />

    <!-- Vertical Fin Highlight -->
    <path d="M256 352 L256 428" stroke="#f43f5e" stroke-width="10" stroke-linecap="round" />
  </g>
</svg>
