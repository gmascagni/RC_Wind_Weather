<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>RC Wind Weather — North GA Flight Deck</title>
    <meta
      name="description"
      content="Real-time wind, gust shear, runway crosswind, and flyability dashboard for RC airplane pilots at Alpharetta, Roswell, and Woodstock, GA."
    />
    <meta name="theme-color" content="#070b12" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RC Wind" />

    <!-- Open Graph / Social Sharing Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="RC Wind Weather — North GA Flight Deck" />
    <meta
      property="og:description"
      content="Live 10m wind, gust envelope, runway crosswind calculator, and RC aircraft suitability for Alpharetta, Roswell, and Woodstock, GA."
    />
    <meta property="og:url" content="https://gmascagni.github.io/RC_Wind_Weather/" />
    <meta property="og:image" content="https://gmascagni.github.io/RC_Wind_Weather/icon-512.png" />
    <meta name="twitter:card" content="summary" />

    <!-- App Icons & Manifest (resolved under Vite BASE_URL /RC_Wind_Weather/) -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />

    <!-- Non-blocking Web Fonts with solid system fallbacks -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Space+Grotesk:wght@600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
